name: Signed Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing LiterallySpotify version tag (for example v0.1.0)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
      - uses: Swatinem/rust-cache@v2
      - name: Validate fork and version tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $package = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object { $_.name -eq 'spotifast' } | Select-Object -First 1
          if ($package.repository -ne 'https://github.com/GUHPY/LiterallySpotify-Spotifast-Mod') { throw 'Only this fork can be released here.' }
          if ($env:RELEASE_TAG -ne "v$($package.version)") { throw 'Tag and Cargo version differ.' }
      - run: python -m pip install -r packaging/requirements-release.txt
      - run: python -m unittest discover -s packaging -p test_maintenance.py
      - run: python packaging/verify-ui.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows assets
        shell: pwsh
        run: ./packaging/windows/build-release.ps1
      - name: Sign release assets
        env:
          LITERALLYSPOTIFY_UPDATE_SIGNING_KEY: ${{ secrets.LITERALLYSPOTIFY_UPDATE_SIGNING_KEY }}
        run: python packaging/sign-release.py dist
      - name: Publish this fork's release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --title "LiterallySpotify $env:RELEASE_TAG" --generate-notes --latest }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create release.' }
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -like 'literallyspotify-*' -or $_.Name -like 'checksums.txt*' } | Select-Object -ExpandProperty FullName)
          gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload signed assets.' }
