name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install -r packaging/requirements-release.txt
      - run: python -m unittest discover -s packaging -p test_maintenance.py
      - run: cargo check --locked --all-targets
      - run: python packaging/verify-ui.py
      - run: cargo clippy --locked --all-targets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-regression-log
          path: target/ui-regression-tests.log
